<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c15">
<title>Ghost Kitchen Inventory · UI Prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<noscript>This prototype needs JavaScript.</noscript>

<div id="previewbar" role="group" aria-label="Preview device">
  <span>Preview</span>
  <button type="button" data-device="web" aria-pressed="true">🖥️ Web</button>
  <button type="button" data-device="android" aria-pressed="false">🤖 Android</button>
</div>

<div id="frame">
  <div class="statusbar" aria-hidden="true"><span id="clock">9:41</span><span>▾ ▴ 📶 🔋 82%</span></div>
  <div id="app"></div>
  <div class="navbar" role="group" aria-label="Android system navigation">
    <button type="button" id="androidBack" aria-label="Android back">◁</button>
    <button type="button" tabindex="-1" aria-hidden="true">○</button>
    <button type="button" tabindex="-1" aria-hidden="true">▢</button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
