name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo-doctor
      - run: npx expo export --platform web
        env:
          CI: '1'

  docker:
    runs-on: ubuntu-latest
    needs: [api, mobile]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t ghost-kitchen-api .
      - run: python3 -m py_compile infra/ocr/server.py
      - run: docker build -t ghost-kitchen-ocr infra/ocr
