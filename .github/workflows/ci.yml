name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx expo-doctor
      - run: npx expo export --platform web
        env:
          CI: '1'

  # The web app in a real browser: doors, the open compartments, the ghost shortcut, adding food, a 320 px
  # phone, and screenshots of the pixel art against e2e/baselines. No server needed.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: apps/mobile
      - run: npx expo export --platform web
        working-directory: apps/mobile
        env:
          CI: '1'
      - run: pip install -r e2e/requirements.txt && python -m playwright install --with-deps chromium
      # The generated sprites must match their scripts (spookify-sprites.py exits non-zero if a door change
      # would cut out detail).
      - run: python scripts/spookify-sprites.py && python scripts/make-pixel-assets.py
        working-directory: apps/mobile
      - run: python e2e/check_sprites.py
      # A live API (in-memory store, no AI) for the two-device sync test.
      - run: npm ci
        working-directory: apps/api
      - run: |
          python e2e/serve.py apps/mobile/dist 8099 &
          (cd apps/api && PORT=3100 npx tsx test/e2e-server.mts &)
          sleep 4
          E2E_URL=http://127.0.0.1:8099 LIVE_API_URL=http://127.0.0.1:3100 python -m pytest e2e -q
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/baselines/*.actual.png
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: [api, mobile, e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t ghost-kitchen-api .
      - run: python3 -m py_compile infra/ocr/server.py
      - run: docker build -t ghost-kitchen-ocr infra/ocr
